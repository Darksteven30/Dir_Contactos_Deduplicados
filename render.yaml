# Despliegue en Render (Blueprint): https://render.com/docs/blueprint-spec
#
# Un solo servicio web sirve la API y el frontend compilado bajo el mismo dominio, para que la
# cookie del refresh token (SameSite=Strict) funcione. La base de datos es PostgreSQL en Neon:
# su URL de conexión se pega en el panel de Render (no se guarda en el repositorio).
services:
  - type: web
    name: dir-contactos-deduplicados
    runtime: node
    plan: free
    # La más cercana a Colombia. La base de Neon debe crearse en la misma zona (AWS us-east-1).
    region: virginia
    # Se publica lo que llega a main (la rama estable); develop es la rama de trabajo.
    branch: main
    autoDeployTrigger: commit
    # --include=dev: TypeScript, Vite y vue-tsc son devDependencies y hacen falta para compilar.
    buildCommand: npm ci --prefix backend --include=dev && npm ci --prefix frontend --include=dev && npm run build
    # Al arrancar, el backend aplica las migraciones pendientes y luego atiende peticiones.
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      # Render pone proxies delante (Cloudflare y su propia infraestructura).
      - key: TRUST_PROXY
        value: "1"
      # El rate limit del login cuenta por la IP que Cloudflare pone en CF-Connecting-IP. Contar por
      # saltos de proxy no sirve aquí: la cadena cambia y se tomaba la IP de un servidor de Cloudflare,
      # repartiendo el límite entre varios contadores. Ver backend/tests/shared/rateLimit.test.ts.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: COOKIE_SECURE
        value: "true"
      - key: LOG_LEVEL
        value: info
      # Render genera un secreto aleatorio de 256 bits la primera vez.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # Cadena de conexión DIRECTA de Neon (no la "pooled"). Se pega en el panel de Render.
      - key: DATABASE_URL
        sync: false
